name: build-release

# 构建 {game}_{version}_{lang} 发布包。
# 流程见仓库根 `github_action流程.txt`，实现见 `Projects/Common/tools/automation/build_release.py`（8 步）。
#
# 产物（两个层次）：
#   release/sr3r_common/ 、release/sr4r_common/ 、release/sr4r_microsoft/
#       中间目录树，build_release.py 产出，**不上传**（只是打包的输入）。
#   release/《黑道圣徒III》_简体中文_通用_补丁_<date>.zip 等三个中文名 zip
#       Projects/Common/tools/cli/pack_release.py 产出，**这就是 Artifact 与 Release 的内容**。
#       上传为三个独立 artifact：sr3r-common / sr4r-common / sr4r-microsoft。
#       每个 zip 可直接解压到游戏根目录；打 tag 时挂到 GitHub Release（三个独立文件）。
#
# 触发：
#   push(master)        —— build 构建 + 校验 + 上传 zip 到 Artifacts；
#                          随后 publish job 在**同一 run** 内自动按「日期-时间」打 tag
#                          并发布 Release（三个独立 zip 作为附件），无需手动打 tag。
#   pull_request        —— 构建 + 校验（门禁；不发布）
#   workflow_dispatch   —— 手动；可勾选跳过 DLL 编译
#
# ★ 不再依赖「tag push 重新触发 workflow」来发版 —— 那样会因
#   GITHUB_TOKEN 推送的 tag 不触发 on:push 工作流（GitHub 防循环机制）而静默失败
#   （package 永远 skipped、Release 建不出 / 无附件）。改为在 push master 的同一
#   run 内由 publish job 用官方 gh CLI 直接建 tag + 发 Release（三个独立 zip 作为附件）。
#
# 忽略纯文档改动（不参与构建），避免无意义的 runner 消耗。
#
# ★ 发布环节用官方 `gh` CLI（GitHub-hosted runner 自带），不依赖第三方 release action，
#   避免中文名附件在 asset label 还原步骤 404 导致发布失败。

on:
  # ★ paths-ignore 对 **tag push 不生效**（GitHub 官方文档：
  #   "Path filters are not evaluated for pushes of tags"）。本仓库已不再用 tag
  #   触发发布（见下方「关键修正」），paths-ignore 仅对推分支生效：
  #     · 推分支 → 走 paths-ignore 过滤（纯文档改动不触发构建）
  #     · 由 publish job 在 push master 的同一 run 内直接发版（不再依赖 tag 重触发）
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'Documents/**'
      - 'Archives/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'Documents/**'
      - 'Archives/**'
  workflow_dispatch:
    inputs:
      skip_dll:
        description: '跳过 DLL 编译（仅重建资源包，需已有 dll 产物 —— CI 上一般不要勾）'
        type: boolean
        default: false

permissions:
  contents: read

# 同一分支/PR 的新推送取消旧的进行中构建，省 runner。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建发布包
    runs-on: windows-2022
    timeout-minutes: 45

    env:
      # 本仓库所有 .py 都用 UTF-8；CI 上 Python 默认 stdin/stdout 编码需强制为 UTF-8，
      # 否则中文输出（构建日志、charlist 统计）会在 Windows 控制台抛 UnicodeEncodeError。
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7.0.1
        # ★ 不使用 lfs: 本仓库**没有任何 LFS 追踪文件**（.gitattributes 只做
        #   二进制声明与 eol 约定，未启用 filter=lfs）。开 lfs: true 会让
        #   checkout 多跑一次 `git lfs pull`，一旦 runner 上 LFS 缺配就报错，
        #   属于无谓的风险面。将来真启用 LFS 时再打开。
        #
        # ★ 版本：v4 跑在 Node 20（GitHub 已弃用并强制升到 24，会刷 warning）。
        #   v5 起为 node24。下面所有 action 都对齐到 node24 版本。

      # ── 环境准备 ─────────────────────────────────────────────────────────
      - name: 配置 Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      # ── 工具集：确保 v141 (MSVC 14.16) 存在 ──────────────────────────────
      #
      # ★★ 为什么必须是 v141（2026-09-21 CI 实测定位）：
      #   MinHook 1.3.3 的 `build\native\minhook.targets` 里工具集**只列到 v141**
      #   （v90/v100/v110/v120/v140/v141），且 `.nupkg` 内**不含** libMinHook.lib
      #   —— 它靠 targets 按 $(PlatformToolset) 前缀匹配后 <Copy> 生成。
      #   v142/v143/v145 全部匹配不上 -> MH_LibSuffix="x64--md" -> 58 条 Copy
      #   条件无一命中 -> `lib\MinHook.lib` 不存在 -> **LNK1104**。
      #   所以这是依赖包的硬约束，不是版本偏好；两个工程已统一改 v141。
      #
      #   而 windows-2022 镜像**默认不带 v141**（官方 Windows2022-Readme 的
      #   组件清单里只有 VC.Tools.x86.x64 与 VC.Tools.142.x86.x64，没有 v141），
      #   因此必须在这里用 VS Installer 现场加装。
      - name: 确保 v141 (MSVC 14.16) 工具集可用
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "找不到 vswhere.exe，镜像里没有 Visual Studio？" }

          function Test-V141 {
            $p = & $vswhere -latest -products * -find "VC\Tools\MSVC\14.16*" |
                   Select-Object -First 1
            return [bool]$p
          }

          if (Test-V141) {
            Write-Host "v141 已存在，跳过安装。"
          } else {
            Write-Host "镜像内无 v141，开始安装 Microsoft.VisualStudio.Component.VC.v141.x86.x64 ..."
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
            if (!(Test-Path $installer)) { throw "找不到 vs_installer.exe：$installer" }

            $vsPath = & $vswhere -latest -products * -property installationPath |
                        Select-Object -First 1
            if (!$vsPath) { throw "vswhere 取不到 Visual Studio 安装路径" }
            Write-Host "目标 VS 安装路径: $vsPath"

            # ★ vs_installer.exe 是 GUI 程序：直接调用会立刻返回，CI 不等它。
            #   必须用 Start-Process -Wait 显式等待。
            #   另外它在 CI 上**不产生控制台输出**（无 console host），属正常现象，
            #   所以失败与否只能靠后面的 vswhere 断言判断。
            Start-Process -FilePath $installer -Wait -ArgumentList @(
              'modify',
              '--installPath', "`"$vsPath`"",
              '--add', 'Microsoft.VisualStudio.Component.VC.v141.x86.x64',
              '--quiet', '--norestart', '--nocache', '--noUpdateInstaller'
            )

            if (!(Test-V141)) {
              # 注意：这里不用 here-string（@"..."@）。它的结束符 "@ 必须顶格，
              # 与 YAML 的 run: | 缩进块冲突，会让 YAML 解析失败。
              Write-Host "!! v141 (MSVC 14.16) 安装后仍不可用。"
              Write-Host "   可能原因："
              Write-Host "     1) 镜像无法在线拉取 VS 组件（需要外网）；"
              Write-Host "     2) 组件 ID 已变更（原 Microsoft.VisualStudio.Component.VC.v141.x86.x64）；"
              Write-Host "     3) 需改用带 VS2026 工具集的 runner。"
              Write-Host "   v141 是 MinHook 1.3.3 的硬约束，缺它必定 LNK1104，无法绕过。"
              throw "v141 (MSVC 14.16) 不可用"
            }
            Write-Host "v141 安装成功。"
          }

      - name: 展示编译器工具集 / Windows SDK（诊断用）
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          Write-Host "── 已安装的 MSVC 工具集 ──"
          & $vswhere -latest -products * -find "VC\Tools\MSVC\*" |
            ForEach-Object { Write-Host "  $_" }
          Write-Host "── 已安装的 Windows SDK ──"
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.Name)" }
          # Windows SDK 19041 是 build_release.py 的 find_winsdk() 首选；
          # windows-2022 镜像装的是 17763/19041/22621/26100，故必然命中 19041。

      - name: 还原 NuGet 包 (MinHook)
        shell: pwsh
        run: |
          # vcxproj Import 了 ..\packages\minhook.1.3.3\build\native\minhook.targets，
          # 缺失时 EnsureNuGetPackageBuildImports 会直接令构建失败。
          # Projects/**/packages/ 在 .gitignore 里 → CI 全新 clone 后必须还原。
          #
          # ★ build_release.py 的 ensure_nuget() 已能自动找 NuGet.exe 并还原，
          #   所以这一步只是「提前、显式」地做一遍，失败能更早暴露且日志更清晰。
          #   找不到 NuGet.exe 时**不报错**，交给 build_release.py 兜底。
          $nuget = $null
          foreach ($cand in @(
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\CommonExtensions\Microsoft\NuGet\NuGet.exe",
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Professional\Common7\IDE\CommonExtensions\Microsoft\NuGet\NuGet.exe",
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\NuGet\NuGet.exe"
          )) {
            if (Test-Path $cand) { $nuget = $cand; break }
          }
          if (!$nuget) {
            $found = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft Visual Studio" -Recurse `
                       -Filter NuGet.exe -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            if ($found) { $nuget = $found.FullName }
          }
          if (!$nuget) {
            Write-Host "镜像内无 NuGet.exe，下载官方命令行版"
            $nuget = "$env:RUNNER_TEMP\nuget.exe"
            Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" `
                              -OutFile $nuget
          }
          Write-Host "NuGet: $nuget"

          # 每个工程各自还原到同级 packages\（与 vcxproj 里 ..\packages\ 的相对路径一致）
          foreach ($rel in @("Projects\SR3\SR3R_I18N", "Projects\SR4\SR4R_I18N")) {
            $cfg = Join-Path $rel "packages.config"
            $dest = Join-Path (Split-Path $rel -Parent) "packages"
            if (!(Test-Path $cfg)) { throw "缺少 $cfg" }
            Write-Host "restore $cfg -> $dest"
            & $nuget restore $cfg -PackagesDirectory $dest -NonInteractive
            if ($LASTEXITCODE -ne 0) { throw "NuGet restore 失败: $cfg" }
          }

          # 硬校验产物落地（还原『成功』不等于文件存在）
          $targets = Get-ChildItem -Recurse -Path Projects -Filter minhook.targets
          if ($targets.Count -lt 2) {
            throw "minhook.targets 只找到 $($targets.Count) 个（期望 2 个）"
          }
          $targets | ForEach-Object { Write-Host "OK: $($_.FullName)" }

      # ── 构建（8 步流程）──────────────────────────────────────────────────
      - name: 构建 release/{game}_{version}
        shell: pwsh
        run: |
          $extra = @()
          if ('${{ github.event.inputs.skip_dll }}' -eq 'true') { $extra += '--skip-dll' }
          python Projects/Common/tools/automation/build_release.py @extra
          if ($LASTEXITCODE -ne 0) { throw "build_release.py 失败 (rc=$LASTEXITCODE)" }

      # ── 产物校验（独立于构建脚本再核一遍）────────────────────────────────
      - name: 校验产物完整性
        shell: pwsh
        run: python Projects/Common/tools/verify/verify_release.py release

      # ── 打包为可分发的中文名 zip ─────────────────────────────────────────
      # ★★ 为什么在 build 阶段就打包（而不是留到 publish job 再压）：
      #   1. **Artifacts 表层直接就是 {game}_{version}.zip** —— 下载即得，
      #      不需要先把目录树下载下来再自己压，也不会让人看不懂里面是什么。
      #   2. **只有一处打包逻辑**。原先发布逻辑用 bash `zip -r -9 -UN=UTF8`，
      #      而 build job 只传目录树，等于同一个包存在两种形态、两处代码，
      #      容易漂移。现在统一由 `Projects/Common/tools/cli/pack_release.py` 产出，publish job
      #      只负责把它挂到 Release。
      #   3. 中文文件名 + UTF-8 标志位由 Python zipfile 保证（见脚本内注释），
      #      比依赖 runner 上有没有 7-Zip / zip 更稳。
      - name: 打包为中文名 zip
        shell: pwsh
        run: |
          # 构建日期显式按 UTC+8 算（runner 默认 UTC，直接用会偏一天）
          python Projects/Common/tools/cli/pack_release.py release
          if ($LASTEXITCODE -ne 0) { throw "pack_release.py 失败 (rc=$LASTEXITCODE)" }

      # ── 上传：三个独立、命名清晰的 artifact（不再封进单个 sr-release-zips 包）──
      # ★ 每个 artifact 内含 1 个中文名 zip（扁平，无 release/ 前缀）：
          #   · Artifacts 页是三个独立条目，不再是一个看不出内容的「大包」；
      #   · publish job 把三个分别下载到 dist/<artifact-name>/ 子目录（每个含 1 个
      #     中文名 zip），再各自校验、以 ASCII 附件名上传（GitHub 不支持中文名附件）。
      - name: 按游戏拆分暂存发布包
        shell: pwsh
        run: |
          $items = @(
            @{ name='sr3r-common';    pat='release/《黑道圣徒III》_简体中文_通用_补丁_*.zip' },
            @{ name='sr4r-common';    pat='release/《黑道圣徒IV》_简体中文_通用_补丁_*.zip' },
            @{ name='sr4r-microsoft'; pat='release/《黑道圣徒IV》_简体中文_微软商店_补丁_*.zip' }
          )
          foreach ($it in $items) {
            $m = @(Get-Item -Path $it.pat -ErrorAction SilentlyContinue)
            if ($m.Count -ne 1) {
              throw "期望恰好 1 个文件匹配 '$($it.pat)'，实际 $($m.Count) 个"
            }
            $dst = Join-Path stage $it.name
            New-Item -ItemType Directory -Force -Path $dst | Out-Null
            Copy-Item -Path $m[0].FullName -Destination $dst
            Write-Host "staged $($it.name) <- $($m[0].Name)"
          }

      - name: "上传 SR3 通用包 (artifact: sr3r-common)"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sr3r-common
          path: stage/sr3r-common
          if-no-files-found: error
          retention-days: 30

      - name: "上传 SR4 通用包 (artifact: sr4r-common)"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sr4r-common
          path: stage/sr4r-common
          if-no-files-found: error
          retention-days: 30

      - name: "上传 SR4 微软商店包 (artifact: sr4r-microsoft)"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sr4r-microsoft
          path: stage/sr4r-microsoft
          if-no-files-found: error
          retention-days: 30

  # push 到 master 时，在「同一个 workflow run」内构建产物已就绪（needs: build），
  # 用官方 gh CLI 建 **日期-时间 tag** 并发布 Release（三个独立 zip 作为附件）。
  # ★ 关键修正（2026-09-30 实测）：旧设计先让 auto-tag 用 GITHUB_TOKEN push 一个 tag，
  #   再指望该 tag push 触发 package job 发版；但 GitHub 规定 **GITHUB_TOKEN 推送的
  #   tag / commit 不会再次触发 on:push 工作流**（防循环），于是 package 永远 skipped，
  #   Release 建不出 / 无附件。故改为「同 run 内发版」，不再依赖 tag 重触发。
  #   tag 名格式：YYYY-MM-DD-HH-MM-SS（无 v 前缀，按 Asia/Shanghai 本地时间）。
  publish:
    name: 发布 Release（push master 自动按日期-时间打 tag）
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ★ 必须检出仓库：publish job 用 `gh api` 建 release + `curl` 上传附件，
      #   需要 git 上下文（git tag + push 建 tag）；否则报
      #   "fatal: not a git repository"（2026-09-30 run 36719311009 实测踩坑）。
      - name: 检出仓库（供 gh 发版确定 git 上下文）
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # 三个 artifact 分别下载到各自子目录（每个子目录含 1 个中文名 zip）
      - name: 下载 SR3 通用包
        uses: actions/download-artifact@v8.0.1
        with:
          name: sr3r-common
          path: dist/sr3r-common

      - name: 下载 SR4 通用包
        uses: actions/download-artifact@v8.0.1
        with:
          name: sr4r-common
          path: dist/sr4r-common

      - name: 下载 SR4 微软商店包
        uses: actions/download-artifact@v8.0.1
        with:
          name: sr4r-microsoft
          path: dist/sr4r-microsoft

      - name: 校验三个包齐全
        run: |
          set -euo pipefail
          for d in sr3r-common sr4r-common sr4r-microsoft; do
            n=$(ls -1 "dist/$d"/*.zip 2>/dev/null | wc -l)
            if [ "$n" -ne 1 ]; then
              echo "!! dist/$d 期望 1 个 zip，实际 $n 个" >&2
              exit 1
            fi
          done
          echo "✓ 三个包齐全（内部为中文名 zip；将以 ASCII 附件名上传，见下方发布步骤）"

      - name: 计算日期-时间 tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(TZ=Asia/Shanghai date +%Y-%m-%d-%H-%M-%S)"
          # 极小概率同秒重复推送：若 tag 已存在则追加运行号
          if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
            tag="${tag}-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "将使用 tag: $tag"

      - name: 建 git tag 并推送
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          git tag "$tag"
          git push origin "$tag"
          echo "✓ 已建 tag: $tag"

      # ★ Release 说明三要素（2026-09-30 按 haojun0823 要求定稿）：
      #   1) **本次构建相关的提交记录**：自上一次 Release 起的 commit 列表，
      #      读者不翻 commit 历史就能知道这一版改了什么；
      #   2) 三个 ASCII 附件 ↔ 中文原名的对照表（附件名不能中文，靠表对照）；
      #   3) **`dist/common/必读说明.txt` 全文**附在说明里 —— 安装 / 卸载 / 常见问题
      #      / 免责声明。该文件是 tracked 的（.gitignore 只忽略 /release/），
      #      checkout 后必在；且 build_release.py 第 6 步把它复制进 release/{gv}/ 再打进
      #      zip，故**此处附录与包内那份同源同版**，玩家不下载也能看到关键说明。
      #      用 <details>+<pre> 包住：保留 txt 原格式（含缩进与 # 号），不渲染成标题。
      - name: 生成 Release 说明（提交记录 + 必读说明）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          slug="${{ github.repository }}"
          # ★ slug 只给 gh api 用（repos/{slug}/...）；拼 **commit 链接** 必须带
          #   https://github.com/ 前缀，否则 markdown 里只是一段普通文字、点不开。
          repo_url="https://github.com/$slug"

          # ── 1) 提交记录范围：上次 Release 的 tag + 对应 commit ───────────
          #    ★ 坑：actions/checkout 默认只拉分支指针、**不拉 tag**（尽管 fetch-depth: 0
          #      把分支历史拉全了）。所以本地未必有上次 release 的 **tag 对象**，
          #      直接用 `git log <tag>..HEAD` 会报
          #      "fatal: ambiguous argument '<tag>..HEAD': unknown revision"。
          #      改用 release 的 **commit.sha** 作范围起点 —— 该 commit 必然在
          #      master 历史里，且再补一道 git cat-file -e 存在性校验。
          #    本次 release 尚未创建，故 releases/latest 即「上一次」。
          latest="$(gh api "repos/$slug/releases/latest" 2>/dev/null || true)"
          prev_tag="$(printf '%s' "$latest" | jq -r '.tag_name // empty' 2>/dev/null || true)"
          prev_sha="$(printf '%s' "$latest" | jq -r '.commit.sha // empty' 2>/dev/null || true)"
          # ★ .commit.sha 对「由 tag 建出」的 release 实测返回空（本地实跑复现），
          #   故退一路查 tag ref；我们是 `git tag <名>` 建的**轻量 tag**，
          #   object.sha 直接就是 commit sha（annotated tag 才会指向 tag 对象）。
          if [ -z "$prev_sha" ] && [ -n "$prev_tag" ]; then
            prev_sha="$(gh api "repos/$slug/git/refs/tags/$prev_tag" --jq '.object.sha // empty' 2>/dev/null || true)"
            if [ "$(git cat-file -t "$prev_sha" 2>/dev/null || true)" = "tag" ]; then
              prev_sha="$(gh api "repos/$slug/git/refs/tags/$prev_tag" --jq '.object.object.sha // empty' 2>/dev/null || true)"
            fi
          fi
          if [ -n "$prev_sha" ] && git cat-file -e "${prev_sha}^{commit}" 2>/dev/null; then
            base="$prev_sha"; base_label="$prev_tag"
            echo "上一次 Release：$prev_tag（$prev_sha）"
          else
            base="$(git rev-list --max-parents=0 HEAD)"; base_label="首个提交"
            echo "无可用历史 Release，以首个提交为基准：$base"
          fi

          # ── 2) 本次构建相关的提交记录 ───────────────────────────────────
          #    字段用 TAB 分隔（%H%x09%s），规避 subject 里的 | 等分隔符字符。
          : > commits.md
          git log --no-merges --max-count=60 --pretty=format:'%H%x09%s' "$base..HEAD" \
            | while IFS=$'\t' read -r h s; do
                if [ -z "$h" ]; then continue; fi   # 不能用 "&& continue"，set -e 下会误退出
                printf -- '- [`%s`](%s/commit/%s) %s\n' "${h:0:7}" "$repo_url" "$h" "$s" >> commits.md
              done
          n=$(grep -c '^- ' commits.md || true)
          echo "本次提交记录：$n 条（基准 $base）"

          # ── 3) 正文骨架 ─────────────────────────────────────────────────
          #    统一用 @@TAG@@ 占位符，最后一遍 sed 替换（heredoc 单引号不自展开）。
          cat > release_notes.md <<'EOF'
          ## 《黑道圣徒》简体中文汉化补丁 · `@@TAG@@`

          简体中文汉化补丁，三套构建分别对应 **SR3 重制版 / SR4 重制版 / SR4 微软商店版**。
          下载对应 zip，**把包内全部文件覆盖到游戏根目录**即可；卸载方法见下方必读说明。

          > ⚠️ GitHub Release 附件名不支持中文（经 API 上传会被静默破坏成 `_._._` 这类），
          > 故附件使用英文文件名；解压后内部文件与目录名均为中文，**不影响使用**。
          > 下表「英文附件名 ↔ 中文原名」一一对应，按你的游戏版本选一个下载即可。
          EOF

          # ── 4) 追加提交记录 ─────────────────────────────────────────────
          {
            echo
            echo "### 🧾 本次更新（自 \`$base_label\` 起，共 ${n} 条提交）"
            echo
            if [ -s commits.md ]; then
              cat commits.md
            else
              echo "(本次构建无新增提交)"
            fi
          } >> release_notes.md

          # ── 5) 追加附件对照表 ───────────────────────────────────────────
          cat >> release_notes.md <<'EOF'

          ### 📦 下载（3 个补丁包，均解压到游戏根目录）

          | 英文附件名 | 对应中文原名 | 适用版本 |
          |---|---|---|
          | `Saint-Row-3-Common-CHS-Patch-@@TAG@@.zip` | 《黑道圣徒III》简体中文通用补丁 | SR3 重制版（Steam / GOG / EPIC） |
          | `Saint-Row-4-Common-CHS-Patch-@@TAG@@.zip` | 《黑道圣徒IV》简体中文通用补丁 | SR4 重制版（Steam / GOG / EPIC） |
          | `Saint-Row-4-Microsoft-CHS-Patch-@@TAG@@.zip` | 《黑道圣徒IV》简体中文微软商店补丁 | SR4 微软商店版 |
          EOF

          # ── 6) 追加必读说明全文（与包内 必读说明.txt 同源）──────────────────
          {
            echo
            echo "### 📖 必读说明（安装 / 卸载 / 常见问题）"
            echo
            if [ -f "dist/common/必读说明.txt" ]; then
              echo "<details><summary>展开完整必读说明（与包内 必读说明.txt 一致）</summary>"
              echo
              echo "<pre>"
              tr -d '\r' < "dist/common/必读说明.txt"   # 消除 CRLF，避免 markdown 里出现 ^M
              echo "</pre>"
              echo
              echo "</details>"
            else
              echo "> ⚠️ 未找到 <code>dist/common/必读说明.txt</code>，本次未附带。"
            fi
            echo
            echo "---"
            echo
            echo "源码仓库：<https://github.com/HaoJun0823/SR_GAME_CHINESE>　·　作者主页：<https://www.haojun0823.xyz/>"
          } >> release_notes.md

          # ── 7) 占位符替换 + 自检 ────────────────────────────────────────
          sed -i "s/@@TAG@@/$tag/g" release_notes.md
          if grep -q '@@TAG@@' release_notes.md; then
            echo "!! 仍有未替换的 @@TAG@@" >&2; exit 1
          fi
          echo "── release_notes.md 生成完毕（$(wc -l < release_notes.md) 行）──"
          head -8 release_notes.md

      # ★ 发布（两步，规避 GitHub 两层坑）：
      #   1) GitHub 已废弃 `api.github.com/repos/{o}/{r}/releases/{id}/assets` 端点
      #      （直传返回 404），必须用建 release 时返回的 `upload_url`（指向
      #      uploads.github.com）上传；
      #   2) GitHub 不支持中文名 release 附件（API 上传会被静默破坏成 `_._._`），
      #      故附件名用 ASCII（Saint-Row-{Game}-{Platform}-CHS-Patch-{DateTime}.zip），
      #      内容仍是中文名 zip。
      - name: 创建 Release 并上传三个 ASCII 名 zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          slug="${{ github.repository }}"
          # 1) 建 release（api.github.com），取 upload_url
          # ★★ body 必须用 **-F**（不能 -f）传：`-f` **不展开 `@file`**，
          #    只会把字符串 "@release_notes.md" 原样当正文；
          #    只有 `-F` 才会读文件内容（实测 run 36739064504，Release 正文
          #    一度是字面量 @release_notes.md —— 玩家看到的说明是空的）。
          REL_JSON=$(gh api -X POST "repos/$slug/releases" \
            -f "tag_name=$tag" -f "name=$tag" \
            -F "body=@release_notes.md" -F "draft=false")
          # ★ 回退保险：若 body 仍是字面量（@file 未展开），退回直接传正文字符串
          if [ "$(jq -r .body <<<"$REL_JSON")" = "@release_notes.md" ]; then
            echo "-F @file 未生效，回退：直接把正文字符串作为 body"
            REL_JSON=$(gh api -X POST "repos/$slug/releases" \
              -f "tag_name=$tag" -f "name=$tag" \
              -f "body=$(cat release_notes.md)" -F "draft=false")
          fi
          # ★ 最终自检：正文必须是「三段结构」而非空 / 字面占位符，否则直接失败
          body_head="$(jq -r .body <<<"$REL_JSON" | head -1)"
          if [ -z "$body_head" ] || [ "$body_head" != "## 《黑道圣徒》简体中文汉化补丁" ]; then
            echo "!! Release body 异常（首行=[$body_head]），检查 -f/-F 与 release_notes.md" >&2; exit 1
          fi
          echo "✓ Release body 已写入（首行：${body_head}…）"
          UPLOAD_URL=$(echo "$REL_JSON" | jq -r .upload_url)
          BASE="${UPLOAD_URL%%\{*}"
          echo "release 已建，upload_base=$BASE"
          # 2) 逐个上传（ASCII 附件名，内容仍是中文名 zip）
          # ★ 不能用 `-G --data-urlencode name=...` + `--data-binary "@$src"` 的组合：
          #   `-G` 会把**所有** --data 选项（含 --data-binary 的 zip 字节）拼进 URL
          #   查询串，导致 `curl: (3) URL rejected: Malformed input to a URL function`。
          #   正确做法：name 直接写进查询串（ASCII 名无需 urlencode），zip 字节走请求体。
          upload_one() {
            local src="$1" ascii="$2"
            echo "⬆️ 上传 $ascii"
            curl -fsSL -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/zip" \
              -H "Accept: application/vnd.github+json" \
              --data-binary "@$src" \
              "${BASE}?name=${ascii}" \
              | jq -r '.name'
            echo "✅ $ascii"
          }
          upload_one "$(ls dist/sr3r-common/*.zip)"    "Saint-Row-3-Common-CHS-Patch-${tag}.zip"
          upload_one "$(ls dist/sr4r-common/*.zip)"    "Saint-Row-4-Common-CHS-Patch-${tag}.zip"
          upload_one "$(ls dist/sr4r-microsoft/*.zip)" "Saint-Row-4-Microsoft-CHS-Patch-${tag}.zip"
          echo "✅ 已发布 Release: $tag"
