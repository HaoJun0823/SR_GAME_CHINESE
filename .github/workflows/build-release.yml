name: build-release

# ══════════════════════════════════════════════════════════════════════════
# 构建 {game}_{version}_{lang} 发布包 —— ubuntu-latest + msvc-wine 版
# ══════════════════════════════════════════════════════════════════════════
# 流程见 `Documents/github_action流程.txt`；实现见
# `Projects/Common/tools/automation/build_release.py`（8 步，资源步骤与本
# workflow 无关，纯 Python 跨平台）。
#
# 产物（两个层次）：
#   release/sr3r_common/ 、release/sr4r_common/ 、release/sr4r_microsoft/
#       中间目录树，build_release.py 产出，**不上传**（只是打包的输入）。
#   release/《黑道圣徒III》_简体中文_通用_补丁_<date>.zip 等三个中文名 zip
#       Projects/Common/tools/cli/pack_release.py 产出，**这就是 Artifact 与
#       Release 的内容**。上传为三个独立 artifact：sr3r-common / sr4r-common /
#       sr4r-microsoft；打 tag 时挂到 GitHub Release（三个独立文件）。
#
# ★★ 2026-10-05 架构切换：Windows runner → ubuntu-latest + msvc-wine。
#   背景：windows-2022 → windows-latest(2025) 后，v141 (MSVC 14.16) 组件在
#   VS Installer 里加装连续翻车（run 37323099359：6.5 分钟后 exit 1 且日志
#   无诊断信息；头号嫌疑是 2025 镜像 C 盘空间紧张），Windows 路线的维护成本
#   已经高于迁移成本。
#
#   新路线（https://github.com/mstorsjo/msvc-wine）：
#     · vsdownload.py 用与 VS 安装器**同一份官方 manifest** 从微软 CDN 拉包，
#       `--major 15 --msvc-version 15.9` 精确锁定 VS2017 15.9 的
#       VC.Tools.14.16 —— 即 **v141 工具集本体**（cl 19.16）+ Win10 SDK
#       10.0.17763（v141 官方搭档）。产出仍是 **v141 编译的 x64 位 .asi**，
#       与历史产物同源同版本；
#     · wine 运行真 cl/link（msvc-wine 的 bin/x64/ 包装脚本自动设置
#       INCLUDE/LIB 并做过大小写修复），没有 MSBuild —— 步骤 1 由
#       build_release.py 的 compile_dll_wine() 把 vcxproj Release|x64 的
#       选项逐项翻译成 cl/link 命令行（见其 docstring 的翻译表）；
#     · MinHook 1.3.3：workflow 从 nuget.org 下载 nupkg（zip 格式）解压出
#       libMinHook-x64-v141-mt.lib 直接链接，**不经过 minhook.targets**
#       （那是 MSBuild 才会跑的 Copy 步骤 —— Windows CI 上「必须 v141」
#       的根因；直接 cl/link 路径上该约束不存在，v141 只是保持与历史
#       产物一致的选择）；
#     · 步骤 2~8（词典/le_string/charlist/字体/Loader/ini/License）是纯
#       Python，Linux 原生运行；verify_release.py 独立校验产出的 x64 PE、
#       /MT 静态 CRT、包结构 —— 质量门禁不因换平台而放松。
#
#   依赖（见 msvc-wine README）：wine64 / msitools(msiextract) / winbind /
#   ca-certificates。工具链目录 ~1GB 落 .msvc/，用 actions/cache 缓存，
#   命中后每次构建省去 5 分钟下载+解包。
#
# 触发：
#   push(master)        —— 构建 + 校验 + 上传 zip 到 Artifacts；publish job
#                          在同一 run 内自动按「日期-时间」打 tag 并发布 Release。
#   pull_request        —— 构建 + 校验（门禁；不发布）
#   workflow_dispatch   —— 手动；可勾选跳过 DLL 编译
#
# ★ 不再依赖「tag push 重新触发 workflow」发版（GITHUB_TOKEN 推送的 tag
#   不触发 on:push 工作流，GitHub 防循环机制）；发布一律在同 run 内由
#   publish job 用官方 gh CLI 直接建 tag + 发 Release。
#
# 忽略纯文档改动（不参与构建），避免无意义的 runner 消耗。

on:
  # ★ paths-ignore 对 tag push 不生效（官方文档）；本仓库已不用 tag 触发，
  #   paths-ignore 仅对推分支生效。
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'Documents/**'
      - 'Archives/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'Documents/**'
      - 'Archives/**'
  workflow_dispatch:
    inputs:
      skip_dll:
        description: '跳过 DLL 编译（仅重建资源包，需已有 dll 产物 —— CI 上一般不要勾）'
        type: boolean
        default: false

permissions:
  contents: read

# 同一分支/PR 的新推送取消旧的进行中构建，省 runner。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建发布包（ubuntu-latest + msvc-wine MSVC v141）
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # 本仓库所有 .py 都用 UTF-8；强制 Python stdin/stdout 为 UTF-8。
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      # msvc-wine 安装目录（vsdownload.py --dest / install.sh 的目标）。
      # 传给 build_release.py 的 compile_dll_wine() 定位 bin/x64/cl|link。
      MSVC_WINE_PREFIX: ${{ github.workspace }}/.msvc
      # msvc-wine 上游 checkout 的 ref。升级时改这里 —— cache key 含它，
      # 会自动换缓存；install.sh 对新旧缓存幂等。
      MSVCWINE_REF: master

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7.0.1
        # ★ 不使用 lfs：本仓库没有任何 LFS 追踪文件（.gitattributes 只做
        #   二进制声明与 eol 约定）。开 lfs: true 属于无谓的风险面。

      # ★ 必须完整 checkout msvc-wine（不能只下载 vsdownload.py）：
      #   install.sh 会用到仓库里的 lowercase / fixinclude（大小写修复，
      #   Linux 大小写敏感文件系统下 MSVC/SDK 头文件名互相引用不区分大小写
      #   的修复必需）、wrappers/（cl/link 包装脚本）、msvctricks.cpp
      #   （自举编译一次 cl 实测可用性）。
      - name: 检出 msvc-wine
        uses: actions/checkout@v7.0.1
        with:
          repository: mstorsjo/msvc-wine
          ref: ${{ env.MSVCWINE_REF }}
          path: .msvc-wine

      - name: 配置 Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      # ── wine 侧依赖（msvc-wine README 的 Prerequisites 原样）─────────
      #   wine64     : 运行真 cl.exe/link.exe
      #   msitools   : msiextract，解 VS 组件与 WinSDK 的 .msi（需 >= 0.98）
      #   winbind    : cl 用 /Zi 时 mspdbsrv 的命名管道通信需要；
      #                本构建不用 /Zi，装上纯属保险
      #   ca-certificates: https 拉微软 CDN
      - name: 安装 wine / msitools 等依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wine64 msitools ca-certificates winbind
          wine --version

      # ── MSVC 工具链缓存 ────────────────────────────────────────────────
      #   缓存 .msvc/（解包完成的工具链，~1GB）。key 含组件组合与 msvc-wine
      #   ref；改下载参数 / 升级 msvc-wine 时 key 自动失效重下。
      #   ★ 注意：缓存命中后 **install.sh 仍会重跑**（下一步无条件执行）：
      #     install.sh 幂等（ln_s 检查存在才建、cp -a 覆盖 wrapper），且能
      #     修复缓存 tar 对 symlink farm 的任何潜在损伤。
      - name: 还原 MSVC 工具链缓存
        uses: actions/cache@v6
        with:
          path: .msvc
          key: msvcwine-v141-vs15.9-sdk17763-x64-${{ env.MSVCWINE_REF }}-v1

      # ── 下载并解包 MSVC v141 + Win10 SDK ─────────────────────────────
      #   ★ --major 15（VS2017 channel）是**关键**：Microsoft.VisualStudio.
      #     Component.VC.Tools.14.16（= v141）只存在于 VS2017 的 manifest；
      #     VS2022+ manifest 里 v141 兼容组件的 ID 不同（VC.v141.x86.x64），
      #     vsdownload.py 找不到时会**静默回退最新工具集**，故必须锁 15。
      #   ★ --msvc-version 15.9 -> VC.Tools.14.16 + SDK 10.0.17763（v141
      #     官方搭档）。SDK 版本不再与 vcxproj 的 WindowsTargetPlatformVersion
      #     字段耦合（那只影响 MSBuild），直接编译用 17763 头/库即可 ——
      #     比 2025 镜像自带的 26100 老编新配稳得多。
      #   ★ 其余 --with-*=no 砍掉 MSBuild/devcmd/DIA/ATL/ASAN：直接
      #     cl/link 用不上，能省几百 MB 下载。
      - name: 下载并解包 MSVC v141 + Win10 SDK（缓存未命中时）
        run: |
          set -euo pipefail
          if [ -x "${MSVC_WINE_PREFIX}/bin/x64/cl" ]; then
            echo "工具链缓存命中，跳过下载（install.sh 仍会重跑以修复 symlink）。"
          else
            python3 .msvc-wine/vsdownload.py \
              --accept-license \
              --major 15 \
              --msvc-version 15.9 \
              --architecture x64 --host-arch x64 \
              --with-msbuild=no --with-devcmd=no --with-dia=no \
              --with-atl=no --with-asan=no \
              --dest "${MSVC_WINE_PREFIX}"
          fi

      # ── install.sh：大小写修复 + 包装脚本生成（幂等，永远跑）────────
      #   它做四件事：a) VC/WindowsKits 目录小写 symlink 化（Linux 大小写
      #   敏感下的必需修复）；b) 生成 bin/x64/{cl,link,...} 包装脚本 +
      #   msvcenv.sh（自动探测 MSVC/SDK 版本目录）；c) wineboot 初始化 wine
      #   prefix；d) 自举编译 msvctricks.cpp —— 一次真实的 wine cl 调用，
      #   编译失败会在日志里直说（比「链路坏了跑构建时才炸」好定位得多）。
      - name: install.sh（生成包装脚本 / 大小写修复）
        run: |
          set -euo pipefail
          sh .msvc-wine/install.sh "${MSVC_WINE_PREFIX}"

      # ── 编译器验证（门禁 + 诊断）──────────────────────────────────────
      #   cl 无参数打印 banner（Microsoft (R) C/C++ Optimizing Compiler
      #   Version 19.16.x for x64）—— **必须**看到 19.16 才放行，防止
      #   vsdownload 参数被上游改动后静默回退成新版工具集（那会改变产物
      #   工具集，违背「与历史 v141 产物一致」的约束）。
      - name: 验证编译器为 MSVC v141（诊断 + 门禁）
        run: |
          set -euo pipefail
          export PATH="${MSVC_WINE_PREFIX}/bin/x64:$PATH"
          banner="$(cl 2>&1 || true)"
          echo "── cl banner ──"
          echo "$banner" | head -2
          if ! echo "$banner" | grep -q "19\.16"; then
            echo "!! cl 不是 MSVC 14.16 (v141) —— vsdownload 可能回退了版本" >&2
            exit 1
          fi
          echo "── Win SDK 版本 ──"
          ls "${MSVC_WINE_PREFIX}/kits/10/include/"
          echo "── 磁盘余量 ──"
          df -h .

      # ── MinHook 1.3.3：nupkg 即 zip，解出 v141 静态库直接链接 ─────────
      #   packages/ 在 .gitignore 里（Projects/**/packages/），CI 必须自备。
      #   直接点名 libMinHook-x64-v141-mt.lib：x64、/MT（与工程
      #   RuntimeLibrary=MultiThreaded 一致）、v141 编译 —— 三者都对齐
      #   vcxproj 经 minhook.targets 在 Windows 上最终链接的那份库，
      #   产物二进制语义不变。
      - name: 下载 MinHook 1.3.3 并解压到两个工程
        run: |
          set -euo pipefail
          curl -fsSL -o minhook.1.3.3.nupkg https://www.nuget.org/api/v2/package/minhook/1.3.3
          rm -rf .minhook_tmp && mkdir .minhook_tmp
          unzip -qo minhook.1.3.3.nupkg -d .minhook_tmp
          for proj in Projects/SR3 Projects/SR4; do
            mkdir -p "$proj/packages/minhook.1.3.3"
            cp -a .minhook_tmp/lib   "$proj/packages/minhook.1.3.3/"
            cp -a .minhook_tmp/build "$proj/packages/minhook.1.3.3/"
          done
          rm -rf .minhook_tmp minhook.1.3.3.nupkg
          for proj in Projects/SR3 Projects/SR4; do
            test -f "$proj/packages/minhook.1.3.3/lib/native/lib/libMinHook-x64-v141-mt.lib"
            test -f "$proj/packages/minhook.1.3.3/lib/native/include/MinHook.h"
          done
          echo "✓ MinHook 1.3.3 (x64-v141-mt) 就位"

      # ── 构建（8 步流程；步骤 1 走 compile_dll_wine）─────────────────
      - name: 构建 release/{game}_{version}
        run: |
          set -euo pipefail
          extra=()
          if [ "${{ github.event.inputs.skip_dll }}" = "true" ]; then
            extra+=(--skip-dll)
          fi
          python3 Projects/Common/tools/automation/build_release.py "${extra[@]}"

      # ── 产物校验（独立于构建脚本再核一遍：x64 PE / 静态 CRT / 包结构）──
      - name: 校验产物完整性
        run: python3 Projects/Common/tools/verify/verify_release.py release

      # ── 打包为可分发的中文名 zip（Python zipfile，UTF-8 标志位保证）──
      - name: 打包为中文名 zip
        run: |
          set -euo pipefail
          python3 Projects/Common/tools/cli/pack_release.py release

      # ── 按游戏拆分暂存（供三个独立 artifact）──────────────────────────
      - name: 按游戏拆分暂存发布包
        run: |
          set -euo pipefail
          shopt -s nullglob
          declare -A items=(
            [sr3r-common]="release/《黑道圣徒III》_简体中文_通用_补丁_*.zip"
            [sr4r-common]="release/《黑道圣徒IV》_简体中文_通用_补丁_*.zip"
            [sr4r-microsoft]="release/《黑道圣徒IV》_简体中文_微软商店_补丁_*.zip"
          )
          for name in sr3r-common sr4r-common sr4r-microsoft; do
            pat="${items[$name]}"
            matches=( $pat )
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "!! '$pat' 期望恰好 1 个文件，实际 ${#matches[@]} 个" >&2
              exit 1
            fi
            mkdir -p "stage/$name"
            cp "${matches[0]}" "stage/$name/"
            echo "staged $name <- $(basename "${matches[0]}")"
          done

      - name: "上传 SR3 通用包 (artifact: sr3r-common)"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sr3r-common
          path: stage/sr3r-common
          if-no-files-found: error
          retention-days: 30

      - name: "上传 SR4 通用包 (artifact: sr4r-common)"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sr4r-common
          path: stage/sr4r-common
          if-no-files-found: error
          retention-days: 30

      - name: "上传 SR4 微软商店包 (artifact: sr4r-microsoft)"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sr4r-microsoft
          path: stage/sr4r-microsoft
          if-no-files-found: error
          retention-days: 30

  # push 到 master 时，在「同一个 workflow run」内构建产物已就绪（needs: build），
  # 用官方 gh CLI 建 **日期-时间 tag** 并发布 Release（三个独立 zip 作为附件）。
  # ★ 关键修正（2026-09-30 实测）：旧设计先让 auto-tag 用 GITHUB_TOKEN push 一个 tag，
  #   再指望该 tag push 触发 package job 发版；但 GitHub 规定 **GITHUB_TOKEN 推送的
  #   tag / commit 不会再次触发 on:push 工作流**（防循环），于是 package 永远 skipped，
  #   Release 建不出 / 无附件。故改为「同 run 内发版」，不再依赖 tag 重触发。
  #   tag 名格式：YYYY-MM-DD-HH-MM-SS（无 v 前缀，按 Asia/Shanghai 本地时间）。
  publish:
    name: 发布 Release（push master 自动按日期-时间打 tag）
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ★ 必须检出仓库：publish job 用 `gh api` 建 release + `curl` 上传附件，
      #   需要 git 上下文（git tag + push 建 tag）；否则报
      #   "fatal: not a git repository"（2026-09-30 run 36719311009 实测踩坑）。
      - name: 检出仓库（供 gh 发版确定 git 上下文）
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # 三个 artifact 分别下载到各自子目录（每个子目录含 1 个中文名 zip）
      - name: 下载 SR3 通用包
        uses: actions/download-artifact@v8.0.1
        with:
          name: sr3r-common
          path: dist/sr3r-common

      - name: 下载 SR4 通用包
        uses: actions/download-artifact@v8.0.1
        with:
          name: sr4r-common
          path: dist/sr4r-common

      - name: 下载 SR4 微软商店包
        uses: actions/download-artifact@v8.0.1
        with:
          name: sr4r-microsoft
          path: dist/sr4r-microsoft

      - name: 校验三个包齐全
        run: |
          set -euo pipefail
          for d in sr3r-common sr4r-common sr4r-microsoft; do
            n=$(ls -1 "dist/$d"/*.zip 2>/dev/null | wc -l)
            if [ "$n" -ne 1 ]; then
              echo "!! dist/$d 期望 1 个 zip，实际 $n 个" >&2
              exit 1
            fi
          done
          echo "✓ 三个包齐全（内部为中文名 zip；将以 ASCII 附件名上传，见下方发布步骤）"

      - name: 计算日期-时间 tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(TZ=Asia/Shanghai date +%Y-%m-%d-%H-%M-%S)"
          # 极小概率同秒重复推送：若 tag 已存在则追加运行号
          if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
            tag="${tag}-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "将使用 tag: $tag"

      - name: 建 git tag 并推送
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          git tag "$tag"
          git push origin "$tag"
          echo "✓ 已建 tag: $tag"

      # ★ Release 说明三要素（2026-09-30 按 haojun0823 要求定稿）：
      #   1) **本次构建相关的提交记录**：自上一次 Release 起的 commit 列表，
      #      读者不翻 commit 历史就能知道这一版改了什么；
      #   2) 三个 ASCII 附件 ↔ 中文原名的对照表（附件名不能中文，靠表对照）；
      #   3) **`dist/common/必读说明.txt` 全文**附在说明里 —— 安装 / 卸载 / 常见问题
      #      / 免责声明。该文件是 tracked 的（.gitignore 只忽略 /release/），
      #      checkout 后必在；且 build_release.py 第 6 步把它复制进 release/{gv}/ 再打进
      #      zip，故**此处附录与包内那份同源同版**，玩家不下载也能看到关键说明。
      #      用 <details>+<pre> 包住：保留 txt 原格式（含缩进与 # 号），不渲染成标题。
      - name: 生成 Release 说明（提交记录 + 必读说明）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          slug="${{ github.repository }}"
          # ★ slug 只给 gh api 用（repos/{slug}/...）；拼 **commit 链接** 必须带
          #   https://github.com/ 前缀，否则 markdown 里只是一段普通文字、点不开。
          repo_url="https://github.com/$slug"

          # ── 1) 提交记录范围：上次 Release 的 tag + 对应 commit ───────────
          #    ★ 坑：actions/checkout 默认只拉分支指针、**不拉 tag**（尽管 fetch-depth: 0
          #      把分支历史拉全了）。所以本地未必有上次 release 的 **tag 对象**，
          #      直接用 `git log <tag>..HEAD` 会报
          #      "fatal: ambiguous argument '<tag>..HEAD': unknown revision"。
          #      改用 release 的 **commit.sha** 作范围起点 —— 该 commit 必然在
          #      master 历史里，且再补一道 git cat-file -e 存在性校验。
          #    本次 release 尚未创建，故 releases/latest 即「上一次」。
          latest="$(gh api "repos/$slug/releases/latest" 2>/dev/null || true)"
          prev_tag="$(printf '%s' "$latest" | jq -r '.tag_name // empty' 2>/dev/null || true)"
          prev_sha="$(printf '%s' "$latest" | jq -r '.commit.sha // empty' 2>/dev/null || true)"
          # ★ .commit.sha 对「由 tag 建出」的 release 实测返回空（本地实跑复现），
          #   故退一路查 tag ref；我们是 `git tag <名>` 建的**轻量 tag**，
          #   object.sha 直接就是 commit sha（annotated tag 才会指向 tag 对象）。
          if [ -z "$prev_sha" ] && [ -n "$prev_tag" ]; then
            prev_sha="$(gh api "repos/$slug/git/refs/tags/$prev_tag" --jq '.object.sha // empty' 2>/dev/null || true)"
            if [ "$(git cat-file -t "$prev_sha" 2>/dev/null || true)" = "tag" ]; then
              prev_sha="$(gh api "repos/$slug/git/refs/tags/$prev_tag" --jq '.object.object.sha // empty' 2>/dev/null || true)"
            fi
          fi
          if [ -n "$prev_sha" ] && git cat-file -e "${prev_sha}^{commit}" 2>/dev/null; then
            base="$prev_sha"; base_label="$prev_tag"
            echo "上一次 Release：$prev_tag（$prev_sha）"
          else
            base="$(git rev-list --max-parents=0 HEAD)"; base_label="首个提交"
            echo "无可用历史 Release，以首个提交为基准：$base"
          fi

          # ── 2) 本次构建相关的提交记录 ───────────────────────────────────
          #    字段用 TAB 分隔（%H%x09%s），规避 subject 里的 | 等分隔符字符。
          : > commits.md
          git log --no-merges --max-count=60 --pretty=format:'%H%x09%s' "$base..HEAD" \
            | while IFS=$'\t' read -r h s; do
                if [ -z "$h" ]; then continue; fi   # 不能用 "&& continue"，set -e 下会误退出
                printf -- '- [`%s`](%s/commit/%s) %s\n' "${h:0:7}" "$repo_url" "$h" "$s" >> commits.md
              done
          n=$(grep -c '^- ' commits.md || true)
          echo "本次提交记录：$n 条（基准 $base）"

          # ── 3) 正文骨架 ─────────────────────────────────────────────────
          #    统一用 @@TAG@@ 占位符，最后一遍 sed 替换（heredoc 单引号不自展开）。
          cat > release_notes.md <<'EOF'
          ## 《黑道圣徒》简体中文汉化补丁 · `@@TAG@@`

          简体中文汉化补丁，三套构建分别对应 **SR3 重制版 / SR4 重制版 / SR4 微软商店版**。
          下载对应 zip，**把包内全部文件覆盖到游戏根目录**即可；卸载方法见下方必读说明。

          > ⚠️ GitHub Release 附件名不支持中文（经 API 上传会被静默破坏成 `_._._` 这类），
          > 故附件使用英文文件名；解压后内部文件与目录名均为中文，**不影响使用**。
          > 下表「英文附件名 ↔ 中文原名」一一对应，按你的游戏版本选一个下载即可。
          EOF

          # ── 4) 追加提交记录 ─────────────────────────────────────────────
          {
            echo
            echo "### 🧾 本次更新（自 \`$base_label\` 起，共 ${n} 条提交）"
            echo
            if [ -s commits.md ]; then
              cat commits.md
            else
              echo "(本次构建无新增提交)"
            fi
          } >> release_notes.md

          # ── 5) 追加附件对照表 ───────────────────────────────────────────
          cat >> release_notes.md <<'EOF'

          ### 📦 下载（3 个补丁包，均解压到游戏根目录）

          | 英文附件名 | 对应中文原名 | 适用版本 |
          |---|---|---|
          | `Saint-Row-3-Common-CHS-Patch-@@TAG@@.zip` | 《黑道圣徒III》简体中文通用补丁 | SR3 重制版（Steam / GOG / EPIC） |
          | `Saint-Row-4-Common-CHS-Patch-@@TAG@@.zip` | 《黑道圣徒IV》简体中文通用补丁 | SR4 重制版（Steam / GOG / EPIC） |
          | `Saint-Row-4-Microsoft-CHS-Patch-@@TAG@@.zip` | 《黑道圣徒IV》简体中文微软商店补丁 | SR4 微软商店版 |
          EOF

          # ── 6) 追加必读说明全文（与包内 必读说明.txt 同源）──────────────────
          {
            echo
            echo "### 📖 必读说明（安装 / 卸载 / 常见问题）"
            echo
            if [ -f "dist/common/必读说明.txt" ]; then
              echo "<details><summary>展开完整必读说明（与包内 必读说明.txt 一致）</summary>"
              echo
              echo "<pre>"
              tr -d '\r' < "dist/common/必读说明.txt"   # 消除 CRLF，避免 markdown 里出现 ^M
              echo "</pre>"
              echo
              echo "</details>"
            else
              echo "> ⚠️ 未找到 <code>dist/common/必读说明.txt</code>，本次未附带。"
            fi
            echo
            echo "---"
            echo
            echo "源码仓库：<https://github.com/HaoJun0823/SR_GAME_CHINESE>　·　作者主页：<https://www.haojun0823.xyz/>"
          } >> release_notes.md

          # ── 7) 占位符替换 + 自检 ────────────────────────────────────────
          sed -i "s/@@TAG@@/$tag/g" release_notes.md
          if grep -q '@@TAG@@' release_notes.md; then
            echo "!! 仍有未替换的 @@TAG@@" >&2; exit 1
          fi
          echo "── release_notes.md 生成完毕（$(wc -l < release_notes.md) 行）──"
          head -8 release_notes.md

      # ★ 发布（两步，规避 GitHub 两层坑）：
      #   1) GitHub 已废弃 `api.github.com/repos/{o}/{r}/releases/{id}/assets` 端点
      #      （直传返回 404），必须用建 release 时返回的 `upload_url`（指向
      #      uploads.github.com）上传；
      #   2) GitHub 不支持中文名 release 附件（API 上传会被静默破坏成 `_._._`），
      #      故附件名用 ASCII（Saint-Row-{Game}-{Platform}-CHS-Patch-{DateTime}.zip），
      #      内容仍是中文名 zip。
      - name: 创建 Release 并上传三个 ASCII 名 zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          slug="${{ github.repository }}"
          # 1) 建 release（api.github.com），取 upload_url
          # ★★ body 必须用 **-F**（不能 -f）传：`-f` **不展开 `@file`**，
          #    只会把字符串 "@release_notes.md" 原样当正文；
          #    只有 `-F` 才会读文件内容（实测 run 36739064504，Release 正文
          #    一度是字面量 @release_notes.md —— 玩家看到的说明是空的）。
          # ★ 建 release 前的「本地预检」：正文不达标就别去远端建（否则会留下
          #   空 Release / 孤儿 tag，得手动清理）。比远端自检更早拦截。
          if [ ! -f release_notes.md ]; then
            echo "!! 未找到 release_notes.md" >&2; exit 1
          fi
          # ★ 段落标记一律用**不含 emoji** 的字符串：emoji 作命令行参数传给 grep
          #   在 Windows Git Bash 下会被代码页转换破坏（本地无法复现验证）。
          for sec in "Saint-Row-3-Common-CHS-Patch" "Saint-Row-4-Microsoft-CHS-Patch" "必读说明"; do
            if ! grep -qF "$sec" release_notes.md; then
              echo "!! release_notes.md 缺少段落「$sec」" >&2; exit 1
            fi
          done
          echo "✓ release_notes.md 预检通过（$(wc -l < release_notes.md) 行）"

          REL_JSON=$(gh api -X POST "repos/$slug/releases" \
            -f "tag_name=$tag" -f "name=$tag" \
            -F "body=@release_notes.md" -F "draft=false")
          # ★ 回退保险：若 body 仍是字面量（@file 未展开），退回直接传正文字符串
          if [ "$(jq -r .body <<<"$REL_JSON")" = "@release_notes.md" ]; then
            echo "-F @file 未生效，回退：直接把正文字符串作为 body"
            REL_JSON=$(gh api -X POST "repos/$slug/releases" \
              -f "tag_name=$tag" -f "name=$tag" \
              -f "body=$(cat release_notes.md)" -F "draft=false")
          fi
          # ★ 最终自检：正文必须是「三段结构」而非空 / 字面占位符，否则直接失败
          #   ★★ run 36740536134 踩坑：标题行带动态 tag 后缀
          #   （「## 《黑道圣徒》简体中文汉化补丁 · `2026-10-01-00-09-01`」），
          #   用 `!=` 精确相等会**把自己判失败**并中断发布 —— 必须前缀匹配。
          body="$(jq -r .body <<<"$REL_JSON")"
          body_head="${body%%$'\n'*}"
          if [ -z "$body_head" ] || [[ "$body_head" != "## 《黑道圣徒》简体中文汉化补丁"* ]]; then
            echo "!! Release body 异常（首行=[$body_head]），检查 -f/-F 与 release_notes.md" >&2; exit 1
          fi
          # 更强校验：下载对照表段 + 必读说明段必须真的进了正文（同预检标记）
          for sec in "Saint-Row-4-Microsoft-CHS-Patch" "必读说明"; do
            if ! grep -qF "$sec" <<<"$body"; then
              echo "!! Release body 缺少段落「$sec」，说明生成不完整" >&2; exit 1
            fi
          done
          echo "✓ Release body 已写入（首行：${body_head}…）"
          UPLOAD_URL=$(echo "$REL_JSON" | jq -r .upload_url)
          BASE="${UPLOAD_URL%%\{*}"
          echo "release 已建，upload_base=$BASE"
          # 2) 逐个上传（ASCII 附件名，内容仍是中文名 zip）
          # ★ 不能用 `-G --data-urlencode name=...` + `--data-binary "@$src"` 的组合：
          #   `-G` 会把**所有** --data 选项（含 --data-binary 的 zip 字节）拼进 URL
          #   查询串，导致 `curl: (3) URL rejected: Malformed input to a URL function`。
          #   正确做法：name 直接写进查询串（ASCII 名无需 urlencode），zip 字节走请求体。
          upload_one() {
            local src="$1" ascii="$2"
            echo "⬆️ 上传 $ascii"
            curl -fsSL -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/zip" \
              -H "Accept: application/vnd.github+json" \
              --data-binary "@$src" \
              "${BASE}?name=${ascii}" \
              | jq -r '.name'
            echo "✅ $ascii"
          }
          upload_one "$(ls dist/sr3r-common/*.zip)"    "Saint-Row-3-Common-CHS-Patch-${tag}.zip"
          upload_one "$(ls dist/sr4r-common/*.zip)"    "Saint-Row-4-Common-CHS-Patch-${tag}.zip"
          upload_one "$(ls dist/sr4r-microsoft/*.zip)" "Saint-Row-4-Microsoft-CHS-Patch-${tag}.zip"
          echo "✅ 已发布 Release: $tag"
