name: build-release

# 构建 {game}_{version}_{lang} 发布包。
# 流程见仓库根 `github_action流程.txt`，实现见 `build_release.py`（8 步）。
#
# 产物（两个层次）：
#   release/sr3r_common/ 、release/sr4r_common/ 、release/sr4r_microsoft/
#       中间目录树，build_release.py 产出，**不上传**（只是打包的输入）。
#   release/《黑道圣徒III》_简体中文_通用_补丁_<date>.zip 等三个中文名 zip
#       Tools/pack_release.py 产出，**这就是 Artifact 与 Release 的内容**。
#       每个 zip 可直接解压到游戏根目录。
#
# 触发：
#   push(main/master)   —— 构建 + 校验 + 上传 zip 到 Artifacts（不做 release）
#   pull_request        —— 构建 + 校验（门禁）
#   workflow_dispatch   —— 手动；可勾选跳过 DLL 编译
#   push tag v*         —— 构建 + 校验 + 上传 zip + 发 Release（见 package job）
#
# 忽略纯文档改动（不参与构建），避免无意义的 runner 消耗。
#
# ★ 所有 action 都 pin 到 **node24** 版本（GitHub 已弃用 Node 20）：
#   checkout v7 / setup-python v7 / upload-artifact v7 / download-artifact v8 /
#   action-gh-release v3。升级前务必核对各 action 的 `runs.using`。

on:
  # ★ paths-ignore 对 **tag push 不生效**（GitHub 官方文档：
  #   "Path filters are not evaluated for pushes of tags"）。
  #   所以 tags 与 paths-ignore 可以共处一个 push 块：
  #     · 推分支 → 走 paths-ignore 过滤（纯文档改动不触发）
  #     · 打 tag → 忽略路径过滤，必定触发（tag 是显式发布动作）
  #   `package` job 靠 `startsWith(github.ref, 'refs/tags/')` 把关，只在 tag 时打包。
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'Documents/**'
      - 'Archives/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'Documents/**'
      - 'Archives/**'
  workflow_dispatch:
    inputs:
      skip_dll:
        description: '跳过 DLL 编译（仅重建资源包，需已有 dll 产物 —— CI 上一般不要勾）'
        type: boolean
        default: false

permissions:
  contents: read

# 同一分支/PR 的新推送取消旧的进行中构建，省 runner。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建发布包
    runs-on: windows-2022
    timeout-minutes: 45

    env:
      # 本仓库所有 .py 都用 UTF-8；CI 上 Python 默认 stdin/stdout 编码需强制为 UTF-8，
      # 否则中文输出（构建日志、charlist 统计）会在 Windows 控制台抛 UnicodeEncodeError。
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7.0.1
        # ★ 不使用 lfs: 本仓库**没有任何 LFS 追踪文件**（.gitattributes 只做
        #   二进制声明与 eol 约定，未启用 filter=lfs）。开 lfs: true 会让
        #   checkout 多跑一次 `git lfs pull`，一旦 runner 上 LFS 缺配就报错，
        #   属于无谓的风险面。将来真启用 LFS 时再打开。
        #
        # ★ 版本：v4 跑在 Node 20（GitHub 已弃用并强制升到 24，会刷 warning）。
        #   v5 起为 node24。下面所有 action 都对齐到 node24 版本。

      # ── 环境准备 ─────────────────────────────────────────────────────────
      - name: 配置 Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      # ── 工具集：确保 v141 (MSVC 14.16) 存在 ──────────────────────────────
      #
      # ★★ 为什么必须是 v141（2026-09-21 CI 实测定位）：
      #   MinHook 1.3.3 的 `build\native\minhook.targets` 里工具集**只列到 v141**
      #   （v90/v100/v110/v120/v140/v141），且 `.nupkg` 内**不含** libMinHook.lib
      #   —— 它靠 targets 按 $(PlatformToolset) 前缀匹配后 <Copy> 生成。
      #   v142/v143/v145 全部匹配不上 -> MH_LibSuffix="x64--md" -> 58 条 Copy
      #   条件无一命中 -> `lib\MinHook.lib` 不存在 -> **LNK1104**。
      #   所以这是依赖包的硬约束，不是版本偏好；两个工程已统一改 v141。
      #
      #   而 windows-2022 镜像**默认不带 v141**（官方 Windows2022-Readme 的
      #   组件清单里只有 VC.Tools.x86.x64 与 VC.Tools.142.x86.x64，没有 v141），
      #   因此必须在这里用 VS Installer 现场加装。
      - name: 确保 v141 (MSVC 14.16) 工具集可用
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "找不到 vswhere.exe，镜像里没有 Visual Studio？" }

          function Test-V141 {
            $p = & $vswhere -latest -products * -find "VC\Tools\MSVC\14.16*" |
                   Select-Object -First 1
            return [bool]$p
          }

          if (Test-V141) {
            Write-Host "v141 已存在，跳过安装。"
          } else {
            Write-Host "镜像内无 v141，开始安装 Microsoft.VisualStudio.Component.VC.v141.x86.x64 ..."
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
            if (!(Test-Path $installer)) { throw "找不到 vs_installer.exe：$installer" }

            $vsPath = & $vswhere -latest -products * -property installationPath |
                        Select-Object -First 1
            if (!$vsPath) { throw "vswhere 取不到 Visual Studio 安装路径" }
            Write-Host "目标 VS 安装路径: $vsPath"

            # ★ vs_installer.exe 是 GUI 程序：直接调用会立刻返回，CI 不等它。
            #   必须用 Start-Process -Wait 显式等待。
            #   另外它在 CI 上**不产生控制台输出**（无 console host），属正常现象，
            #   所以失败与否只能靠后面的 vswhere 断言判断。
            Start-Process -FilePath $installer -Wait -ArgumentList @(
              'modify',
              '--installPath', "`"$vsPath`"",
              '--add', 'Microsoft.VisualStudio.Component.VC.v141.x86.x64',
              '--quiet', '--norestart', '--nocache', '--noUpdateInstaller'
            )

            if (!(Test-V141)) {
              # 注意：这里不用 here-string（@"..."@）。它的结束符 "@ 必须顶格，
              # 与 YAML 的 run: | 缩进块冲突，会让 YAML 解析失败。
              Write-Host "!! v141 (MSVC 14.16) 安装后仍不可用。"
              Write-Host "   可能原因："
              Write-Host "     1) 镜像无法在线拉取 VS 组件（需要外网）；"
              Write-Host "     2) 组件 ID 已变更（原 Microsoft.VisualStudio.Component.VC.v141.x86.x64）；"
              Write-Host "     3) 需改用带 VS2026 工具集的 runner。"
              Write-Host "   v141 是 MinHook 1.3.3 的硬约束，缺它必定 LNK1104，无法绕过。"
              throw "v141 (MSVC 14.16) 不可用"
            }
            Write-Host "v141 安装成功。"
          }

      - name: 展示编译器工具集 / Windows SDK（诊断用）
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          Write-Host "── 已安装的 MSVC 工具集 ──"
          & $vswhere -latest -products * -find "VC\Tools\MSVC\*" |
            ForEach-Object { Write-Host "  $_" }
          Write-Host "── 已安装的 Windows SDK ──"
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.Name)" }
          # Windows SDK 19041 是 build_release.py 的 find_winsdk() 首选；
          # windows-2022 镜像装的是 17763/19041/22621/26100，故必然命中 19041。

      - name: 还原 NuGet 包 (MinHook)
        shell: pwsh
        run: |
          # vcxproj Import 了 ..\packages\minhook.1.3.3\build\native\minhook.targets，
          # 缺失时 EnsureNuGetPackageBuildImports 会直接令构建失败。
          # Projects/**/packages/ 在 .gitignore 里 → CI 全新 clone 后必须还原。
          #
          # ★ build_release.py 的 ensure_nuget() 已能自动找 NuGet.exe 并还原，
          #   所以这一步只是「提前、显式」地做一遍，失败能更早暴露且日志更清晰。
          #   找不到 NuGet.exe 时**不报错**，交给 build_release.py 兜底。
          $nuget = $null
          foreach ($cand in @(
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\CommonExtensions\Microsoft\NuGet\NuGet.exe",
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Professional\Common7\IDE\CommonExtensions\Microsoft\NuGet\NuGet.exe",
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\NuGet\NuGet.exe"
          )) {
            if (Test-Path $cand) { $nuget = $cand; break }
          }
          if (!$nuget) {
            $found = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft Visual Studio" -Recurse `
                       -Filter NuGet.exe -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            if ($found) { $nuget = $found.FullName }
          }
          if (!$nuget) {
            Write-Host "镜像内无 NuGet.exe，下载官方命令行版"
            $nuget = "$env:RUNNER_TEMP\nuget.exe"
            Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" `
                              -OutFile $nuget
          }
          Write-Host "NuGet: $nuget"

          # 每个工程各自还原到同级 packages\（与 vcxproj 里 ..\packages\ 的相对路径一致）
          foreach ($rel in @("Projects\SR3\SR3R_I18N", "Projects\SR4\SR4R_I18N")) {
            $cfg = Join-Path $rel "packages.config"
            $dest = Join-Path (Split-Path $rel -Parent) "packages"
            if (!(Test-Path $cfg)) { throw "缺少 $cfg" }
            Write-Host "restore $cfg -> $dest"
            & $nuget restore $cfg -PackagesDirectory $dest -NonInteractive
            if ($LASTEXITCODE -ne 0) { throw "NuGet restore 失败: $cfg" }
          }

          # 硬校验产物落地（还原『成功』不等于文件存在）
          $targets = Get-ChildItem -Recurse -Path Projects -Filter minhook.targets
          if ($targets.Count -lt 2) {
            throw "minhook.targets 只找到 $($targets.Count) 个（期望 2 个）"
          }
          $targets | ForEach-Object { Write-Host "OK: $($_.FullName)" }

      # ── 构建（8 步流程）──────────────────────────────────────────────────
      - name: 构建 release/{game}_{version}
        shell: pwsh
        run: |
          $extra = @()
          if ('${{ github.event.inputs.skip_dll }}' -eq 'true') { $extra += '--skip-dll' }
          python build_release.py @extra
          if ($LASTEXITCODE -ne 0) { throw "build_release.py 失败 (rc=$LASTEXITCODE)" }

      # ── 产物校验（独立于构建脚本再核一遍）────────────────────────────────
      - name: 校验产物完整性
        shell: pwsh
        run: python Tools/verify_release.py release

      # ── 打包为可分发的中文名 zip ─────────────────────────────────────────
      # ★★ 为什么在 build 阶段就打包（而不是留到 package job 再压）：
      #   1. **Artifacts 表层直接就是 {game}_{version}.zip** —— 下载即得，
      #      不需要先把目录树下载下来再自己压，也不会让人看不懂里面是什么。
      #   2. **只有一处打包逻辑**。原先 package job 用 bash `zip -r -9 -UN=UTF8`，
      #      而 build job 只传目录树，等于同一个包存在两种形态、两处代码，
      #      容易漂移。现在统一由 `Tools/pack_release.py` 产出，package job
      #      只负责把它挂到 Release。
      #   3. 中文文件名 + UTF-8 标志位由 Python zipfile 保证（见脚本内注释），
      #      比依赖 runner 上有没有 7-Zip / zip 更稳。
      - name: 打包为中文名 zip
        shell: pwsh
        run: |
          # 构建日期显式按 UTC+8 算（runner 默认 UTC，直接用会偏一天）
          python Tools/pack_release.py release
          if ($LASTEXITCODE -ne 0) { throw "pack_release.py 失败 (rc=$LASTEXITCODE)" }

      # ── 上传：artifact 里就是三个中文名 zip ──────────────────────────────
      # ★ 只传 `release/*.zip`，**不再传目录树**：
      #   · 目录树形态的 artifact（原先的 sr-release-all）有 62 MB，且与
      #     另一个 artifact 内容完全相同 —— 同一批文件传两遍，纯浪费配额；
      #   · 真正要分发的是 zip，目录树只是中间态。
      #   zip 已是压缩后的形态（约 20 MB/个），三个合计约 62 MB，反而更小。
      - name: 上传发布包（三个中文名 zip）
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sr-release-zips
          path: release/*.zip
          if-no-files-found: error
          retention-days: 30

  # 打 tag 时把 build 阶段已打好的 zip 挂到 Release。
  # ★ 这里**不再自己压 zip** —— 打包逻辑只有 `Tools/pack_release.py` 一处，
  #   本 job 只负责「取产物 + 发 Release」，避免两份代码漂移。
  package:
    name: 发布 Release（仅 tag）
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载发布包
        uses: actions/download-artifact@v8.0.1
        with:
          name: sr-release-zips
          path: dist

      - name: 列出待发布文件（便于核对）
        run: |
          set -euo pipefail
          echo "── 下载到的发布包 ──"
          ls -la dist/
          # ★ 硬断言：三个包必须齐，少任何一个都不能发 Release。
          n=$(ls -1 dist/*.zip 2>/dev/null | wc -l)
          echo "共 $n 个 zip"
          if [ "$n" -ne 3 ]; then
            echo "!! 期望 3 个 zip，实际 $n 个" >&2
            exit 1
          fi

      - name: 创建 Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            《黑道圣徒》简体中文汉化补丁

            构建日期（UTC+8）：`${{ github.event.release.tag_name }}` 对应的提交
            见下方 release notes；包内 `必读说明.txt` 有安装/卸载说明。

            | 压缩包 | 适用版本 |
            |---|---|
            | `《黑道圣徒III》_简体中文_通用_补丁_*.zip` | SR3 重制版（Steam / GOG / EPIC） |
            | `《黑道圣徒IV》_简体中文_通用_补丁_*.zip` | SR4 重制版（Steam / GOG / EPIC） |
            | `《黑道圣徒IV》_简体中文_微软商店_补丁_*.zip` | SR4 微软商店版 |

            各压缩包**解压到游戏根目录**即可（覆盖同名文件）。
            安装 / 卸载 / 常见问题见包内 `必读说明.txt`。
