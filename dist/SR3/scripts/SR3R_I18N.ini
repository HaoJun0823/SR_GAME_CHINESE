; SR3R_I18N 配置（与 SR3R_I18N.asi 同目录; UTF-8）
; v7.4 早期整句替换版: 语言服务返回层整句替换 (lang_early=1), 引擎布局自行按 CJK 切行
; dict_dir / origin_dir 均为可选 - 目录缺失时自动进入 font-only 模式(内置字符集), 可直接删除
; dict_dir   = 词典文件夹（相对本目录; 可选, 仅调试文本替换时使用）
; origin_dir = 联表文件夹（相对本目录; 可选）
; font_file  = 中文字体 TTF 文件名（相对本目录; 需 TrueType, 建议思源黑体 HW SC）
; dump_enabled = 是否收集未命中文本到 DumpText.dtxt（内核汉化后无意义, 建议 0）
; lang_early = 语言服务(sub_140812060/040)返回层整句替换（默认 1; 命中词典的完整句
;              提前换中文, 引擎自切行 -> 换行字幕不再依赖 wrap-rejoin 状态机）
; early_diag = 诊断日志（默认 1; 记录早期替换命中/Format 调用点归类, 验证完可设 0）
; subtitle_early = 字幕绘制入口(sub_1402D2BC0)整句替换（默认 1; 折行前换中文整句,
;              引擎按 CJK 宽度自然折行 -> 语音字幕长句不再漏译）
; charlist_file = 字符清单文件名（相对本目录; 可选, 缺省即 charlist.txt;
;              合并官方简体 le_data 用字 -> 补齐词典外的缺字如"齿";
;              文件不存在时仅日志提示, 不影响运行）
; v7.8.1 loose_first = 让根目录的 loose 资源文件优先于 vpp_pc 包内资源（默认 1）
;              原理: 引擎用一张「挂载表」决定资源从哪加载, 按表头顺序逐个尝试, 先命中者胜。
;              原版注册时把 vpp 项插到了表头, 「磁盘 loose 探测」项被挤到后面,
;              导致 vpp_pc 永远先命中（这就是过去 loose le_strings 实测无效的原因）。
;              本 DLL 在进程启动早期直接调用引擎自带的注册器, 把磁盘项搬回表头。
;              影响范围: 所有资源类型（le_strings / xtbl / 等）—— 根目录投放同名 loose
;              文件即可覆盖包内版本, 无需再动 vpp_pc。
;              注意: 只改「加载优先级」, 不修改/删除 vpp_pc 包本身。
;              若出现资源冲突或异常, 设为 0 可完全恢复原版行为。
;              v7.8.2 修正: 必须等引擎的注册序列（连续 3 项）全部结束、且表项数
;              稳定后再插队; 否则会与引擎自身的后续注册打架, 导致游戏启动崩溃。
; exe        = 版本强制覆盖（默认 auto; 可选 auto/steam/gog/epic）
;              默认 auto=读主模块 PE 头 TimeDateStamp 自动判别（EPIC 版官方 exe 也叫
;              SRTTR.exe, 与 Steam 同名, 必须靠 PE 指纹而非文件名; GOG 主程序暂未实测,
;              若报错请把日志里 "NEWBUILD TimeDateStamp=..." 那行发给作者补指纹）

[settings]
dict_dir = dict
origin_dir = origin
font_file = SourceHanSansHWSC-VF.ttf
charlist_file = charlist.txt
dump_enabled = 1
lang_early = 1
early_diag = 1
subtitle_early = 1
loose_first = 1
exe = auto
